name: 'Doctor'

on:
  workflow_call:
    secrets:
      DOCTOR_API_KEY:
        description: 'API key for pushing scores to app.the-doctor.report'
        required: false

permissions:
  contents: read
  # pr-comment: true posts the doctor report on the pull request.
  pull-requests: write

jobs:
  doctor:
    name: 'Vue Doctor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The dead-code pass (knip) loads vite.config.ts and the husky hooks to
      # see which dev tools are used; without node_modules the config fails to
      # load and every tool it references reads as an unused dependency.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit with vue-doctor
        uses: geoql/doctor-action@v2
        with:
          framework: vue
          preset: recommended
          threshold: ${{ vars.DOCTOR_THRESHOLD || '70' }}
          fail-on: error
          api-key: ${{ secrets.DOCTOR_API_KEY }}
          project: ${{ github.repository }}
          pr-comment: true
          comment-mode: both
