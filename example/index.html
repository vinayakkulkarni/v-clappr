    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('v-clappr-color-mode');
        } catch (_) {}
        var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
